<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111615">
  <title>The White Room | Point-and-Click Escape Game</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="game.js"></script>
</head>
<body>
  <main class="app">
    <section id="gameShell" class="game-shell" aria-label="The White Room escape game">
      <div class="game-canvas" id="gameCanvas">
        <img class="room-background" id="roomBackground" src="asset/images/Room.png" alt="A white room" draggable="false">
        <div class="scene-tint" aria-hidden="true"></div>
        <div id="sceneObjects" class="scene-objects"></div>

        <!-- Incoming scene is progressively revealed behind the moving black bar. -->
        <div id="sceneIncoming" class="scene-incoming" aria-hidden="true"></div>
        <div id="wipeBar" class="wipe-bar" aria-hidden="true"></div>

        <nav class="navigation" aria-label="Turn to another wall">
          <button id="turnLeft" class="turn-button left" title="Turn left" aria-label="Turn left"><span aria-hidden="true">‹</span></button>
          <button id="turnRight" class="turn-button right" title="Turn right" aria-label="Turn right"><span aria-hidden="true">›</span></button>
        </nav>

        <header class="topbar" aria-label="Game settings">
          <button id="musicToggle" class="text-button" aria-label="Toggle background music" aria-pressed="false">♫ Music Off</button>
          <button id="restart" class="text-button" title="Erase saved progress and restart">↻ Restart</button>
        </header>

        <section class="hud" aria-label="Inventory and game messages">
          <div id="inventory" class="inventory" aria-label="Three inventory slots"></div>
          <div id="status" class="status" role="status" aria-live="polite">Click the letter on the table.</div>
        </section>

        <div id="ending" class="ending" hidden>
          <video id="endingVideo" playsinline muted loop preload="none" aria-label="Moonlight reflected in a pond">
            <source src="asset/media/Moon.mp4" type="video/mp4">
          </video>
          <div class="moon-fallback" id="moonFallback" aria-hidden="true"><div class="moon-disc"></div><div class="water-glow"></div></div>
          <div class="ending-caption" id="endingCaption">The moon waits on both sides of the water.</div>
          <button class="ending-restart" id="endingRestart">Begin again</button>
        </div>
      </div>
    </section>
    <div id="inputBlocker" class="input-blocker" aria-hidden="true" hidden></div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-scrim" data-close-modal></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-heading"><div><span class="eyebrow" id="modalSubtitle">LOOK CLOSER</span><h2 id="modalTitle">Inspect</h2></div><button id="modalClose" class="modal-close" aria-label="Close inspection">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>
</body>
</html>
